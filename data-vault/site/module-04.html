<h2 id="overview-0">Назначение модуля</h2>
<p>Детерминированные ключи требуют общего контракта сериализации и бизнес-идентичности. Прежде чем вычислять хеш, необходимо решить, что означает уникальность клиента, договора или отношения и как обрабатывать одинаковые значения из разных источников.</p>
<h2 id="overview-1">Банковский пример</h2>
<p>Договор 0007 и строка « 0007 » должны обрабатываться по формальному правилу нормализации, но ведущие нули нельзя удалять без подтверждения их смысла.</p>
<h3 id="t001">1. Business Key Identification</h3>
<p><strong>Определение и принцип.</strong> Business key выбирается по устойчивой идентичности бизнес-объекта. Нужно выяснить, может ли ключ изменяться, переиспользоваться, иметь области уникальности и существовать в разных системах.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере клиентов и договоров разных систем: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте канонизации, области уникальности и происхождения ключа. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>
<h3 id="t002">2. Business Key Uniqueness</h3>
<p><strong>Определение и принцип.</strong> Уникальность бизнес-ключа определяют в предметной области и области действия источника. Номер договора может быть уникален только вместе с кодом организации или продукта.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере клиентов и договоров разных систем: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>

<p><strong>Определение и принцип.</strong> Коллизия бизнес-ключей возникает, когда одинаковое значение обозначает разные сущности. Её отличают от хеш-коллизии, при которой разные входы дают один хеш.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере клиентов и договоров разных систем: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>

<p><strong>Определение и принцип.</strong> Составной бизнес-ключ комбинирует несколько полей для идентичности, например source_system + local_customer_id. Порядок и обработка NULL должны быть зафиксированы.</p>

<h3 id="t005">5. Source System Key vs Enterprise Business Key</h3>
<p><strong>Определение и принцип.</strong> Локальный ключ идентифицирует запись в одной системе; enterprise business key предназначен для общего смысла между системами. Переход требует явного mapping и правил доверия.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере клиентов и договоров разных систем: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>

<h3 id="t006">6. Hash Keys</h3>
<p><strong>Определение и принцип.</strong> Hash key — детерминированный идентификатор, вычисленный из стандартизированного бизнес-ключа или комбинации ключей. Используется для сопоставления строк и связей между наборами данных.</p>
<p><strong>Практическая интерпретация.</strong> HK_CUSTOMER = SHA-256(канонизированное значение CUSTOMER_BK); одинаковый вход и одинаковая спецификация дают одинаковый результат.</p>
<p><strong>Ограничения и проверки.</strong> Хеш-ключ не является шифрованием, а значение, полученное из чувствительного идентификатора, само по себе не обеспечивает анонимность.</p>
<h3 id="t007">7. Hashdiffs</h3>
<p><strong>Определение и принцип.</strong> Hashdiff — хеш нормализованного набора описательных атрибутов, предназначенный для обнаружения изменений в Satellite. Его состав должен быть зафиксирован как часть контрактного определения модели.</p>
<p><strong>Практическая интерпретация.</strong> При изменении customer_name или customer_status новый hashdiff приводит к новой версии описания при корректной логике загрузки.</p>
<p><strong>Ограничения и проверки.</strong> Разница в порядке колонок, NULL-маркерах и форматах строк вызывает ложные изменения.</p>
<h3 id="t008">8. MD5 vs SHA-256</h3>
<p><strong>Определение и принцип.</strong> MD5 выдаёт 128-битный результат, SHA-256 — 256-битный. Оба могут использоваться для детерминированных ключей, однако MD5 криптографически сломан и не подходит для задач защиты от подделок.</p>
<p><strong>Практическая интерпретация.</strong> В проекте определяют один алгоритм и одну спецификацию сериализации ключей; изменение алгоритма требует миграционного плана.</p>
<p><strong>Ограничения и проверки.</strong> Ни один конечный хеш не исключает коллизии математически; риск и последствия оценивают отдельно.</p>
<h3 id="t009">9. Hash Collision и его ограничения</h3>
<p><strong>Определение и принцип.</strong> Хеш-коллизия — совпадение результата для разных нормализованных входов. Математически неизбежна для конечного пространства, поэтому важно понимать вероятность и стратегию проверки.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере клиентов и договоров разных систем: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте канонизации, области уникальности и происхождения ключа. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>

<p><strong>Определение и принцип.</strong> Стандартизация фиксирует алгоритм, кодировку UTF-8, регистр, trim, приведение типов, NULL, разделитель и порядок компонентов. Весь pipeline обязан использовать одни правила.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере клиентов и договоров разных систем: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>

<h3 id="t011">11. NULL Handling in Hashing</h3>
<p><strong>Определение и принцип.</strong> NULL необходимо отличать от пустой строки и иных специальных значений. Канонизация задаёт кодировку, trim, регистр, типизацию, разделитель и экранирование разделителя.</p>
<p><strong>Практическая интерпретация.</strong> Пары ("A|B", "C") и ("A", "B|C") не должны сериализоваться в одну и ту же строку.</p>
<p><strong>Ограничения и проверки.</strong> Не используйте безусловный CONCAT_WS без анализа NULL: в отдельных СУБД он пропускает NULL-аргументы.</p>

<p><strong>Определение и принцип.</strong> Строковая нормализация устраняет согласованные различия представления. Не следует автоматически переводить в верхний регистр идентификаторы, где регистр имеет бизнес-смысл.</p>

<p><strong>Определение и принцип.</strong> Ghost/unknown member — специальная запись, позволяющая обработать отсутствующую или неизвестную ссылку в предусмотренных паттернах. Её нельзя смешивать с реальной бизнес-сущностью.</p>

<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте канонизации, области уникальности и происхождения ключа. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>
<h3 id="t019">19. Business Key Harmonization</h3>
<p><strong>Определение и принцип.</strong> Гармонизация связывает различающиеся бизнес-ключи источников с общей идентичностью без потери исходных соответствий. Это отдельная, аудируемая задача, особенно при смене идентификаторов.</p>
<p><strong>Практическая интерпретация.</strong> Один клиент может иметь внутренние ID в CRM и АБС; таблица соответствий с периодами действия помогает связать источники.</p>
<p><strong>Ограничения и проверки.</strong> Совпадение ФИО или телефона само по себе не доказывает тождественность клиентов.</p>
<h3 id="t020">20. Same-As и Identity Resolution</h3>
<p><strong>Определение и принцип.</strong> Identity resolution определяет, соответствуют ли разные исходные записи одному объекту. Same-As хранит явное сопоставление, желательно с происхождением, версиями и качеством решения.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере клиентов и договоров разных систем: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте канонизации, области уникальности и происхождения ключа. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>
<h2 id="overview-2">Технический пример</h2>
<pre><code class="language-python">import hashlib

def hash_key(parts):
    # Демонстрация: нужен проектный контракт сериализации!
    normalized = [str(x).strip().upper() if x is not None else '&lt;NULL&gt;' for x in parts]
    payload = '|'.join(f'{len(v)}:{v}' for v in normalized)
    return hashlib.sha256(payload.encode('utf-8')).hexdigest()

assert hash_key(['abc', 12]) == hash_key([' ABC ', 12])
