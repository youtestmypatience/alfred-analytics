<h2 id="overview-0">Назначение модуля</h2>
<p>Data Vault — не только три вида таблиц. Это подход, в котором отдельно рассматриваются организация потоков данных, моделирование, ответственность и способ поставки изменений. Существование Data Vault 2.1 не отменяет необходимость понимать модель 2.0.</p>
<h2 id="overview-1">Банковский пример</h2>
<p>CRM и АБС используют разные идентификаторы клиента. Raw Vault сохраняет версии обоих источников; Business Vault разрешает сопоставление согласно задокументированной процедуре.</p>
<h2 id="overview-2">Схема потока данных</h2>
<pre><code class="language-mermaid">flowchart LR
    S[Source Systems] --&gt; ST[Landing / Staging]
    ST --&gt; H[Raw Vault: Hubs / Links / Satellites]
    H --&gt; B[Business Vault: PIT / Bridge]
    B --&gt; M[Dimensional Marts]
    M --&gt; BI[BI / Analytics]
</code></pre>
<h3 id="t001">1. История Data Vault 1.0</h3>
<p><strong>Определение и принцип.</strong> Data Vault возник как подход к интеграции бизнес-ключей, отношений и исторических описаний из нескольких систем. Базовые сущности Hub, Link, Satellite предшествовали оформлению Data Vault 2.0.</p>
<p><strong>Практическая интерпретация.</strong> При изменении названия клиента бизнес-ключ остаётся в Hub, а версия имени появляется в Satellite.</p>
<p><strong>Ограничения и проверки.</strong> История версий методологии должна отделяться от версий макросов конкретных инструментов.</p>
<h3 id="t002">2. Причины появления Data Vault 2.0</h3>
<p><strong>Определение и принцип.</strong> Data Vault 2.0 развивает моделирование, архитектуру и методологию поставки с упором на масштабируемость, автоматизацию, параллельную загрузку, трассируемость и итерационную разработку.</p>
<p><strong>Практическая интерпретация.</strong> На MPP-платформе хеш-ключи позволяют распределённо рассчитывать идентификаторы без централизованной sequence.</p>
<p><strong>Ограничения и проверки.</strong> Хеши требуют согласованной канонизации входных бизнес-ключей; сам MD5/SHA алгоритм задачу не решает.</p>
<h3 id="t003">3. Различия между Data Vault 1.0 и 2.0</h3>
<p><strong>Определение и принцип.</strong> <strong>Различия между Data Vault 1.0 и 2.0</strong> — самостоятельное понятие в методологии Data Vault. При проектировании необходимо сформулировать его назначение, входные и выходные данные, правила применимости и зависимость от соседних компонентов. Для корректной реализации следует явно зафиксировать границы Raw/Business Vault, метаданных и воспроизводимости. Термин рассматривается в контексте всей архитектуры, а не как изолированная настройка.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере исторического банковского DWH: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте границы Raw/Business Vault, метаданных и воспроизводимости. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>

<h3 id="t010">10. Raw Data Vault vs Business Vault</h3>
<p><strong>Определение и принцип.</strong> Raw Data Vault содержит интегрированные, историзируемые данные источников с ограниченным набором жёстких технических правил. Business Vault содержит производные конструкции и бизнес-правила интерпретации данных, включая PIT и Bridge.</p>
<p><strong>Практическая интерпретация.</strong> Raw Vault сохраняет состояния договора из АБС; Business Vault вычисляет выбранный бизнес-статус договора по утверждённому правилу приоритета источников.</p>
<p><strong>Ограничения и проверки.</strong> Бизнес-правила меняются: важно не переписывать исходную историю и сохранять версии логики.</p>
<h3 id="t011">11. Hard Business Rules vs Soft Business Rules</h3>
<p><strong>Определение и принцип.</strong> Hard rules — технические операции, необходимые для достоверного приёма данных и создания ключей, например приведение форматов и устранение точных дублей согласно правилам. Soft rules — изменяемая интерпретация, расчёты и согласование бизнес-понятий.</p>
<p><strong>Практическая интерпретация.</strong> Преобразование строки даты в timestamp — жёсткое преобразование; правило «активный договор» по нескольким системам — бизнес-интерпретация.</p>
<p><strong>Ограничения и проверки.</strong> Классификация конкретного правила зависит от методологической практики организации; документируйте границу.</p>
