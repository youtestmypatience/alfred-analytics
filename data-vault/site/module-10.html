<h2 id="overview-0">Назначение модуля</h2>
<p>Модель Data Vault предназначена для исторической интеграции, тогда как конечному пользователю чаще нужны удобные факты, измерения и семантические определения. Витрина задаёт grain и превращает исторические данные в проверяемые метрики.</p>
<h2 id="overview-1">Банковский пример</h2>
<p>FACT_LOAN_MONTHLY с grain «один договор на дату отчёта» соединяется с DIM_PRODUCT, DIM_BRANCH и DIM_DATE для расчёта портфельных показателей.</p>
<h3 id="t001">1. Information Delivery Layer</h3>
<p><strong>Определение и принцип.</strong> <strong>Information Delivery Layer</strong> — самостоятельное понятие в аналитических витринах. При проектировании необходимо сформулировать его назначение, входные и выходные данные, правила применимости и зависимость от соседних компонентов. Для корректной реализации следует явно зафиксировать grain, семантики метрики, историчности и способа соединения. Термин рассматривается в контексте всей архитектуры, а не как изолированная настройка.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере витрины выдач и просрочки: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте grain, семантики метрики, историчности и способа соединения. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>
