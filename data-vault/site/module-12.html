<h2 id="overview-0">Назначение модуля</h2>
<p>Промышленная эксплуатация охватывает расписания, восстановление, тестирование, метаданные, производительность и безопасность. Успешная загрузка и правильная аналитика — разные показатели, которые нужно контролировать независимо.</p>
<h2 id="overview-1">Банковский пример</h2>
<p>Airflow управляет загрузками, dbt проводит трансформации и тесты, мониторинг отслеживает задержку данных и сбои, RBAC ограничивает доступ к клиентским данным.</p>
<h2 id="overview-2">Orchestration</h2>
<h3 id="t001">1. Workflow Orchestration</h3>
<p><strong>Определение и принцип.</strong> <strong>Workflow Orchestration</strong> — самостоятельное понятие в промышленной платформе. При проектировании необходимо сформулировать его назначение, входные и выходные данные, правила применимости и зависимость от соседних компонентов. Для корректной реализации следует явно зафиксировать SLA, доступа, диагностики и сценариев восстановления. Термин рассматривается в контексте всей архитектуры, а не как изолированная настройка.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере ежедневной банковской загрузки: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте SLA, доступа, диагностики и сценариев восстановления. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>
<h3 id="t002">2. Directed Acyclic Graph (DAG)</h3>
<p><strong>Определение и принцип.</strong> DAG — ориентированный ациклический граф зависимостей, в котором не допускаются циклы между задачами.</p>
<p><strong>Практическая интерпретация.</strong> Загрузка Hub и независимых Satellites может распараллеливаться при соблюдении зависимостей данных.</p>
<p><strong>Ограничения и проверки.</strong> Дублирование зависимостей и слишком крупные задачи усложняют восстановление после сбоев.</p>
<h3 id="t003">3. Apache Airflow Architecture</h3>
<p><strong>Определение и принцип.</strong> Airflow планирует и наблюдает DAG задач; scheduler организует запуски, executor исполняет задачи, metadata database хранит состояние. Конкретный набор компонентов зависит от версии и deployment.</p>
<p><strong>Практическая интерпретация.</strong> DAG выполняет ingestion → staging tests → raw vault → business vault → marts.</p>
<p><strong>Ограничения и проверки.</strong> Airflow — не средство переноса данных само по себе: операторы запускают внешнюю работу.</p>

<h2 id="overview-3">Data Quality &amp; Observability</h2>
<h3 id="t011">11. Data Quality Dimensions</h3>
<p><strong>Определение и принцип.</strong> Качество данных оценивают по определённым измерениям: полнота, уникальность, валидность, согласованность, точность и актуальность. Определения и допустимые пороги должны быть согласованы для каждого набора данных.</p>
<p><strong>Практическая интерпретация.</strong> Проверка договоров: contract_bk NOT NULL, отсутствие логических дублей, допустимые значения статуса и SLA свежести.</p>
<p><strong>Ограничения и проверки.</strong> «Успешный pipeline» не означает, что данные корректны для бизнеса.</p>
