<h2 id="overview-0">Назначение модуля</h2>
<p>Поток загрузки связывает источник и Raw Vault через извлечение, staging, дедупликацию и контроль идемпотентности. Надёжность проверяется не только в нормальном режиме, но и при повторных запусках, опоздавших данных и изменениях схем.</p>
<h2 id="overview-1">Банковский пример</h2>
<p>Первичная полная загрузка клиентов, затем log-based CDC; staging нормализует ключи, а Raw Vault вставляет только новые идентичности и версии.</p>
<h2 id="overview-2">Схема потока данных</h2>
<pre><code class="language-mermaid">flowchart LR
    S[Source Systems] --&gt; ST[Landing / Staging]
    ST --&gt; H[Raw Vault: Hubs / Links / Satellites]
    H --&gt; B[Business Vault: PIT / Bridge]
    B --&gt; M[Dimensional Marts]
    M --&gt; BI[BI / Analytics]
</code></pre>

<h3 id="t004">4. Change Data Capture (CDC)</h3>
<p><strong>Определение и принцип.</strong> CDC обнаруживает вставки, изменения и удаления в транзакционном источнике. Способы: чтение транзакционного журнала, триггеры, timestamp-поля и сравнение снимков; их полнота и нагрузка различаются.</p>
<p><strong>Практическая интерпретация.</strong> Debezium читает изменения поддерживаемой СУБД и публикует события в поток передачи данных.</p>
<p><strong>Ограничения и проверки.</strong> Необходимо учитывать начальный snapshot, порядок сообщений, commit offsets, tombstones и повторную доставку.</p>

<p><strong>Практическая интерпретация.</strong> Повторная загрузка одного CSV после сбоя не должна удваивать Hub и Satellite.</p>

<h2 id="overview-3">Технический пример</h2>
<pre><code class="language-sql">-- Пример безопасной дедупликации входного batch по event_id
WITH ranked AS (
 SELECT *, row_number() OVER (
   PARTITION BY event_id ORDER BY source_updated_at DESC, ingest_dts DESC
 ) AS rn
 FROM staging.payment_event_batch
)
SELECT * FROM ranked WHERE rn = 1;
-- Нужен стабильный tie-breaker при полном совпадении сортировки.
