name: Deploy Alfred Analytics and Data Vault to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build both knowledge bases
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _build _site
          mkdir -p _build/antifraud _build/data-vault _site
          # Preserve the original Alfred Analytics antifraud website.
          test -f Alfred_Analytics_Antifraud_Site.zip
          unzip -q Alfred_Analytics_Antifraud_Site.zip -d _build/antifraud
          test -d _build/antifraud/alfred_analytics_site
          cp -a _build/antifraud/alfred_analytics_site/. _site/
          test -f _site/index.html
          test -f _site/assets/styles.css
          test -d _site/articles
          # Deploy the Data Vault site at a separate URL.
          test -f Data_Vault_Knowledge_Base.zip
          unzip -q Data_Vault_Knowledge_Base.zip -d _build/data-vault
          test -f _build/data-vault/site/index.html
          test -f _build/data-vault/site/assets/app.js
          test -f _build/data-vault/site/assets/auth.js
          mkdir -p _site/data-vault
          cp -a _build/data-vault/site/. _site/data-vault/
          touch _site/.nojekyll _site/data-vault/.nojekyll
          test -f _site/data-vault/module-12.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
