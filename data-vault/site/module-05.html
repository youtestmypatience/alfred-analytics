<h2 id="overview-0">Назначение модуля</h2>
<p>Hub фиксирует бизнес-идентичность, Link — отношения, Satellite — описания и их историю. Разделение помогает загружать источники независимо и восстанавливать происхождение изменений. Это центральный модуль программы.</p>
<h2 id="overview-1">Банковский пример</h2>
<p>HUB_CUSTOMER, HUB_CONTRACT, LINK_CUSTOMER_CONTRACT и SAT_CONTRACT_STATUS образуют каркас для истории договоров и их участников.</p>
<h2 id="overview-2">Схема потока данных</h2>
<pre><code class="language-mermaid">flowchart LR
    S[Source Systems] --&gt; ST[Landing / Staging]
    ST --&gt; H[Raw Vault: Hubs / Links / Satellites]
    H --&gt; B[Business Vault: PIT / Bridge]
    B --&gt; M[Dimensional Marts]
    M --&gt; BI[BI / Analytics]
</code></pre>
<h2 id="overview-3">Схема структуры Hub–Link–Satellite</h2>
<pre><code class="language-mermaid">flowchart TB
    HC[HUB_CUSTOMER] --- LC[LINK_CUSTOMER_CONTRACT]
    LC --- HD[HUB_CONTRACT]
    HC --- SC[SAT_CUSTOMER]
    HD --- SD[SAT_CONTRACT]
</code></pre>
<h2 id="overview-4">Hub</h2>
<h3 id="t001">1. Hub Purpose and Structure</h3>
<p><strong>Определение и принцип.</strong> Hub хранит уникальные бизнес-ключи сущности и технические метаданные происхождения. Обычно содержит hash key, business key, load timestamp и record source. Описательные меняющиеся атрибуты относятся к Satellites.</p>
<p><strong>Практическая интерпретация.</strong> HUB_CUSTOMER(CUSTOMER_HK, CUSTOMER_BK, LOAD_DTS, RECORD_SOURCE).</p>
<p><strong>Ограничения и проверки.</strong> Hub не обязан содержать «текущую» версию клиента: Hub фиксирует идентичность, а не состояние.</p>
<h3 id="t002">2. Business Key Selection</h3>
<p><strong>Определение и принцип.</strong> <strong>Business Key Selection</strong> — самостоятельное понятие в моделировании Raw Data Vault. При проектировании необходимо сформулировать его назначение, входные и выходные данные, правила применимости и зависимость от соседних компонентов. Для корректной реализации следует явно зафиксировать зерна объекта, технических ключей, load timestamp и record source. Термин рассматривается в контексте всей архитектуры, а не как изолированная настройка.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере HUB_CUSTOMER, LINK_CUSTOMER_CONTRACT и SAT_CONTRACT: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте зерна объекта, технических ключей, load timestamp и record source. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>

<h2 id="overview-5">Link</h2>
<h3 id="t011">11. Link Purpose and Structure</h3>
<p><strong>Определение и принцип.</strong> Link фиксирует существование отношения между Hub-ключами или экземплярами бизнес-событий. Он хранит идентификаторы участников, ключ Link и происхождение. Историческое описание отношения выносится в Satellite.</p>
<p><strong>Практическая интерпретация.</strong> LINK_CUSTOMER_ACCOUNT(LINK_HK, CUSTOMER_HK, ACCOUNT_HK, LOAD_DTS, RECORD_SOURCE).</p>
<p><strong>Ограничения и проверки.</strong> Заранее определите grain Link: участие клиента в счёте и событие назначения роли — разные отношения.</p>
