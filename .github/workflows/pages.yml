name: Deploy Alfred Analytics to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild site archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _build _site
          cat $(find .sitechunks -maxdepth 1 -type f -name 'part-*' | sort) > _build/site.tar.xz.b64
          base64 --decode _build/site.tar.xz.b64 > _build/site.tar.xz
          tar -xJf _build/site.tar.xz -C _build
          cp -a _build/alfred_analytics_site/. _site/
          touch _site/.nojekyll
          test -f _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
