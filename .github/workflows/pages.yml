name: Deploy Alfred Analytics to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Alfred Analytics site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _build _site
          mkdir -p _build _site
          test -f Alfred_Analytics_Antifraud_Site.zip
          unzip -q Alfred_Analytics_Antifraud_Site.zip -d _build
          test -d _build/alfred_analytics_site
          cp -a _build/alfred_analytics_site/. _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/assets/styles.css
          test -d _site/articles

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
