<h2 id="overview-0">Назначение модуля</h2>
<p>Историчность — это не просто колонка created_at. Для воспроизводимости нужно отличать время события, действия бизнес-факта, получения и загрузки. От этих определений зависят as-of отчёты, поздние события и ретроспективные пересчёты.</p>
<h2 id="overview-1">Банковский пример</h2>
<p>Статус договора исправлен задним числом: дата действия — 1 марта, дата получения исправления — 5 марта. Отчёты «как было известно» и «как верно сейчас» дадут разные результаты.</p>
<h3 id="t001">1. Historical Data Storage</h3>
<p><strong>Определение и принцип.</strong> <strong>Historical Data Storage</strong> — самостоятельное понятие в исторических данных. При проектировании необходимо сформулировать его назначение, входные и выходные данные, правила применимости и зависимость от соседних компонентов. Для корректной реализации следует явно зафиксировать оси времени, временного интервала, опоздания и ретроспективных корректировок. Термин рассматривается в контексте всей архитектуры, а не как изолированная настройка.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере портфельного отчёта за прошлую дату: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте оси времени, временного интервала, опоздания и ретроспективных корректировок. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>
<h3 id="t002">2. Valid Time vs Transaction Time</h3>
<p><strong>Определение и принцип.</strong> Valid time — период, когда факт верен в предметной области. Transaction/system time — период, когда версия была известна и сохранена системой. Это две независимые временные оси.</p>
<p><strong>Практическая интерпретация.</strong> Смена адреса действует с 1 марта, но сообщение получено 10 марта: valid time и время регистрации различаются.</p>
<p><strong>Ограничения и проверки.</strong> Не используйте LOAD_DTS как автоматическую замену бизнес-дате действия.</p>

<h3 id="t006">6. Bitemporal Data Modeling</h3>
<p><strong>Определение и принцип.</strong> Битемпоральная модель хранит бизнес-время действия и время знания системы. Позволяет отвечать как «что было верно на дату», так и «что мы знали на тот момент».</p>
<p><strong>Практическая интерпретация.</strong> Исправление даты начала договора задним числом не уничтожает старую версию знания.</p>
<p><strong>Ограничения и проверки.</strong> Вместо одной даты «обновлено» нужны явные временные интервалы и правила коррекции.</p>
<h3 id="t007">7. Point-in-Time Queries</h3>
<p><strong>Определение и принцип.</strong> Point-in-time query собирает состояние данных на заданный момент. Он выбирает последние применимые версии описаний с учётом выбранной временной семантики.</p>
<p><strong>Практическая интерпретация.</strong> Для отчёта на 31 декабря выбирается статус договора, действовавший на эту дату, а не сегодняшнее значение.</p>
<p><strong>Ограничения и проверки.</strong> Определите: as of по load time, по business effective time или по обоим.</p>

<p><strong>Практическая интерпретация.</strong> Событие платежа за понедельник поступает в четверг и должно корректно попасть в исторический отчёт.</p>
<p><strong>Ограничения и проверки.</strong> Watermark и политика replay должны позволять восстановить пропущенные события.</p>
