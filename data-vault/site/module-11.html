<h2 id="overview-0">Назначение модуля</h2>
<p>dbt организует преобразования как версии SQL-моделей, зависимости, макросы, тесты и документацию. Специализированные пакеты AutomateDV и DataVault4dbt автоматизируют отдельные паттерны загрузки, но не заменяют требований к ключам и качеству.</p>
<h2 id="overview-1">Банковский пример</h2>
<p>dbt-модели строят staging, Hub/Link/Satellite и витрины; тесты проверяют ключи и актуальность, а artifacts помогают отследить выполнение.</p>
<h3 id="t001">1. dbt Core Architecture</h3>
<p><strong>Определение и принцип.</strong> dbt Core компилирует SQL/Jinja-модели и исполняет их как преобразования на платформе данных через адаптер. Граф зависимостей строится по ref()/source().</p>
<p><strong>Практическая интерпретация.</strong> Модель stg_contract ссылается на источник, hub_contract использует ref(stg_contract), а витрина — ref(hub_contract).</p>
<p><strong>Ограничения и проверки.</strong> dbt не является самостоятельным движком хранения и не заменяет ingestion или полноценный оркестратор.</p>

<h3 id="t005">5. <code>ref()</code> и <code>source()</code></h3>
<p><strong>Определение и принцип.</strong> ref() объявляет зависимость от другой dbt-модели и возвращает корректное имя отношения. source() ссылается на объявленный внешний источник. Они позволяют строить lineage и выбирать модели в DAG.</p>
<p><strong>Практическая интерпретация.</strong> select * from {{ ref("stg_customer") }}; select * from {{ source("abs", "customer") }}.</p>
<p><strong>Ограничения и проверки.</strong> Не заменяйте ref() строковой конкатенацией схем и таблиц без необходимости.</p>
<h3 id="t006">6. Jinja Templates</h3>
<p><strong>Определение и принцип.</strong> Jinja — шаблонизатор, с помощью которого dbt генерирует SQL во время компиляции. Используется для циклов, условных блоков, конфигураций и вызовов макросов.</p>
<p><strong>Практическая интерпретация.</strong> Цикл Jinja формирует одинаковые выражения для нескольких полей hashdiff.</p>
<p><strong>Ограничения и проверки.</strong> Нужно различать время компиляции шаблона и время выполнения результирующего SQL.</p>

<h3 id="t008">8. Materializations: View, Table, Incremental</h3>
<p><strong>Определение и принцип.</strong> Materialization задаёт форму создания модели: view — запрос без полной материализации; table — перестраиваемая таблица; incremental — обработка нового/изменённого набора с сохранением ранее загруженного.</p>
<p><strong>Практическая интерпретация.</strong> Hub большого объёма может загружаться инкрементально; небольшую справочную витрину допустимо перестраивать целиком.</p>
<p><strong>Ограничения и проверки.</strong> Выбор incremental требует корректного фильтра и уникального ключа; иначе легко получить дубли.</p>
