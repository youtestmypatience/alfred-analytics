<h2 id="overview-0">Назначение модуля</h2>
<p>Расширенные сущности решают случаи, которые не покрывает упрощённый пример Hub–Link–Satellite: много одновременно действительных значений, история действительности отношений, зависимые элементы и идентичность между источниками.</p>
<h2 id="overview-1">Банковский пример</h2>
<p>У клиента одновременно два телефона, а один договор может менять ответственного менеджера. MAS описывает параллельные значения; Effectivity отражает действительность отношений.</p>
<h3 id="t001">1. Effectivity Satellite</h3>
<p><strong>Определение и принцип.</strong> Effectivity Satellite хранит сведения о действительности отношения во времени. Семантика открытых и закрытых отношений зависит от загрузочного паттерна и того, отражает ли источник полный снимок или события.</p>
<p><strong>Практическая интерпретация.</strong> Связь клиента и счёта была активна с одной даты до другой; история действия связи определяется не простым наличием строки Link.</p>
<p><strong>Ограничения и проверки.</strong> Отсутствие строки в инкрементальной выгрузке не доказывает удаление отношения.</p>
<h3 id="t002">2. Multi-Active Satellite (MAS)</h3>
<p><strong>Определение и принцип.</strong> Multi-Active Satellite позволяет хранить несколько одновременно действительных значений атрибута или набора атрибутов для одного родительского ключа. Для различения строк нужен дополнительный идентификатор активности.</p>
<p><strong>Практическая интерпретация.</strong> У клиента одновременно несколько телефонов; отдельный multi-active key различает их версии.</p>
<p><strong>Ограничения и проверки.</strong> Обычный Satellite с одним payload на родителя и момент не заменяет MAS при параллельно активных значениях.</p>
<h3 id="t003">3. Child Dependent Key</h3>
<p><strong>Определение и принцип.</strong> Child Dependent Key — компонент, уточняющий идентичность записи зависимого объекта в контексте родительских бизнес-ключей, когда самостоятельный Hub не оправдан.</p>
<p><strong>Практическая интерпретация.</strong> Строка договора с номером позиции может идентифицироваться парой contract_bk и line_number.</p>
<p><strong>Ограничения и проверки.</strong> Нельзя добавлять child key, не определив его устойчивость и уровень детализации.</p>
<h3 id="t004">4. Record-Tracking Satellite</h3>
<p><strong>Определение и принцип.</strong> <strong>Record-Tracking Satellite</strong> — самостоятельное понятие в специализированных паттернах Vault. При проектировании необходимо сформулировать его назначение, входные и выходные данные, правила применимости и зависимость от соседних компонентов. Для корректной реализации следует явно зафиксировать множественности значений, времени действия и правила источника. Термин рассматривается в контексте всей архитектуры, а не как изолированная настройка.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере отношений клиента, договора и участника: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте множественности значений, времени действия и правила источника. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>

<p><strong>Практическая интерпретация.</strong> CRM_CUST_77 и ABS_CLIENT_194 связаны как один клиент после утверждённой процедуры matching.</p>
<p><strong>Ограничения и проверки.</strong> Ошибочная автоматическая склейка объектов создаёт систематические ошибки во всех аналитических витринах.</p>
