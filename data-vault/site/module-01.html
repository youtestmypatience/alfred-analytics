<h2 id="overview-0">Назначение модуля</h2>
<p>В этой главе рассматриваются задачи аналитических платформ, границы между операционными и аналитическими системами, слои интеграции и основные архитектурные школы. Ключевая идея: аналитическая система должна сохранять воспроизводимость и единый смысл данных при изменении первичных систем.</p>
<h2 id="overview-1">Банковский пример</h2>
<p>ABS/CRM → landing → staging → EDW/Core → витрины кредитов и платежей. OLTP обслуживает клиентов, EDW сохраняет согласованную историю, BI читает витрины.</p>
<h3 id="t001">1. OLTP vs OLAP</h3>
<p><strong>Определение и принцип.</strong> OLTP (Online Transaction Processing) обслуживает короткие операции записи и чтения для прикладного процесса. OLAP (Online Analytical Processing) оптимизирован под аналитические запросы, большие сканирования, соединения и агрегаты. Это различие в характере нагрузки, а не обязательное разделение по продуктам.</p>
<p><strong>Практическая интерпретация.</strong> Пример: выдача кредита обновляет статус заявки в OLTP; аналитик сравнивает винтажи, суммы выдач и просрочку за несколько лет в OLAP.</p>
<p><strong>Ограничения и проверки.</strong> Нельзя выполнять длительные аналитические сканирования на критичной транзакционной системе без оценки влияния на задержки и блокировки.</p>
<h3 id="t002">2. Data Warehouse vs Data Lake vs Lakehouse</h3>
<p><strong>Определение и принцип.</strong> Data Warehouse — управляемое аналитическое хранилище интегрированных данных. Data Lake ориентирован на хранение данных разных форматов, включая файлы и события. Lakehouse объединяет файловое озеро с механизмами управления таблицами и аналитическими гарантиями, которые дают табличные форматы и вычислительные движки.</p>
<p><strong>Практическая интерпретация.</strong> Один поток может сохранять исходные CDC-события в объектном хранилище, преобразовывать их в исторические таблицы и публиковать витрины BI.</p>
<p><strong>Ограничения и проверки.</strong> Не следует отождествлять архитектуру Lakehouse с конкретным продуктом; гарантии транзакционности зависят от формата таблиц и реализации.</p>
<h3 id="t003">3. Enterprise Data Warehouse (EDW)</h3>
<p><strong>Определение и принцип.</strong> EDW — корпоративное аналитическое хранилище с общими определениями сущностей и согласованными правилами интеграции. Оно решает задачу повторного использования данных между направлениями, а не только подготовки одного отчёта.</p>
<p><strong>Практическая интерпретация.</strong> Единое понятие «договор» связывает кредитные, платёжные и клиентские данные; разница источников фиксируется в метаданных.</p>
<p><strong>Ограничения и проверки.</strong> Согласование бизнес-ключей, владельцев данных и единых определений метрик часто сложнее самого создания таблиц.</p>
<h3 id="t004">4. Operational Data Store (ODS)</h3>
<p><strong>Определение и принцип.</strong> ODS интегрирует оперативные данные для сравнительно свежих запросов и операционных процессов. Как правило, фокусируется на текущем или близком к текущему состоянии; долгосрочная историчность не является его универсальным требованием.</p>
<p><strong>Практическая интерпретация.</strong> Сводка актуальных статусов заявок из нескольких каналов доступна оператору без обращения ко всем исходным системам.</p>
<p><strong>Ограничения и проверки.</strong> ODS не равен Raw Vault: сохранение полной истории и воспроизводимость изменений требуют отдельного проектирования.</p>
<h3 id="t005">5. ETL vs ELT</h3>
<p><strong>Определение и принцип.</strong> В ETL преобразования выполняются до загрузки в целевое аналитическое хранилище. В ELT данные сначала загружаются, а затем преобразуются вычислительными средствами целевой платформы. Оба подхода могут использовать staging и проверки качества.</p>
<p><strong>Практическая интерпретация.</strong> ELT-поток: загрузить выгрузку договоров в landing, нормализовать поля в staging SQL, записать Hub/Link/Satellite.</p>
<p><strong>Ограничения и проверки.</strong> Место выполнения преобразований само по себе не гарантирует ни качество, ни безопасность, ни низкую стоимость.</p>
<h3 id="t006">6. Batch Processing vs Streaming</h3>
<p><strong>Определение и принцип.</strong> Batch обрабатывает ограниченные порции данных по расписанию или событию. Streaming обрабатывает непрерывно поступающие события, часто с небольшими окнами и состоянием. Streaming не означает автоматически exactly-once на всём пути.</p>
<p><strong>Практическая интерпретация.</strong> Ночной расчёт кредитного портфеля — batch; передача событий новых платежей через Kafka — потоковый ingestion.</p>
<p><strong>Ограничения и проверки.</strong> Нужно отдельно определить доставку, порядок, дубликаты, задержку и условия повторной обработки.</p>
<h3 id="t007">7. Source Systems, Landing Zone и Staging</h3>
<p><strong>Определение и принцип.</strong> Source system — система возникновения записи. Landing сохраняет полученные сырые данные, staging нормализует формат для загрузки. Нужно отделять transport metadata от бизнес-атрибутов.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере сквозного потока данных: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте источников, частоты обновления и требований к потребителям. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>
<h3 id="t008">8. Data Integration</h3>
<p><strong>Определение и принцип.</strong> Интеграция объединяет данные разных источников через сопоставление сущностей, схем, типов, времени и правил качества. Простейший UNION без reconciliation не решает задачу идентичности.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере сквозного потока данных: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте источников, частоты обновления и требований к потребителям. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>
<h3 id="t009">9. Data Lineage и Data Provenance</h3>
<p><strong>Определение и принцип.</strong> Lineage показывает путь преобразования от источника к потребителю: таблицы, поля, задачи и зависимости. Provenance описывает происхождение конкретных данных: источник, время, версию, операцию и контекст получения.</p>
<p><strong>Практическая интерпретация.</strong> Для поля суммы просрочки lineage покажет цепочку source → staging → vault → mart; provenance поможет установить, из какого события и загрузки получено значение.</p>
<p><strong>Ограничения и проверки.</strong> Для расследований важны технические идентификаторы загрузок и неизменяемые журналы.</p>
<h3 id="t010">10. Data Governance</h3>
<p><strong>Определение и принцип.</strong> Data Governance определяет права принятия решений по данным, ответственность за определения, доступ, классификацию, качество и жизненный цикл. Технологические каталоги поддерживают governance, но не заменяют политики и владельцев.</p>
<p><strong>Практическая интерпретация.</strong> Для клиентского идентификатора определяются владелец, разрешённые случаи использования, срок хранения и контроль доступа.</p>
<p><strong>Ограничения и проверки.</strong> Без согласованных определений две витрины могут выдавать разные KPI при технически правильных SQL-запросах.</p>
<h3 id="t011">11. Logical vs Physical Data Architecture</h3>
<p><strong>Определение и принцип.</strong> Логическая архитектура описывает роли компонентов и движение данных независимо от платформы. Физическая архитектура — конкретные кластеры, базы, сети, хранилища и настройки.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере сквозного потока данных: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте источников, частоты обновления и требований к потребителям. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>
<h3 id="t012">12. Data Warehouse Layers: Staging, Core, Data Marts</h3>
<p><strong>Определение и принцип.</strong> Staging нормализует полученные данные; Core обеспечивает единое историческое представление; marts оптимизируют данные для потребителей. Границы выбирают исходя из ответственности за преобразования.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере сквозного потока данных: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>

<h3 id="t013">13. Top-down и Bottom-up архитектуры DWH</h3>
<p><strong>Определение и принцип.</strong> Top-down начинает с интегрированной корпоративной модели, затем строит витрины. Bottom-up начинает с согласованных предметных витрин, по мере расширения формируя общую шину измерений.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере сквозного потока данных: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>

<h3 id="t014">14. Inmon vs Kimball vs Data Vault</h3>
<p><strong>Определение и принцип.</strong> Inmon ассоциируется с интегрированной корпоративной моделью и зависимыми витринами; Kimball — с dimensional bus и согласованными измерениями; Data Vault — с историзируемой интеграцией Hub/Link/Satellite. В реальной архитектуре подходы можно сочетать.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере сквозного потока данных: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>

<h2 id="overview-2">Технический пример</h2>
<pre><code class="language-sql">-- Агрегирование в аналитической витрине, а не в транзакционном OLTP
SELECT date_trunc('month', issued_at)::date AS issue_month,
       count(*) AS issued_loans,
       sum(amount) AS issued_amount
FROM mart.fact_loan_issuance
GROUP BY 1 ORDER BY 1;
</code></pre>
