<h2 id="overview-0">Назначение модуля</h2>
<p>Моделирование начинается с бизнес-сущностей и уровня детализации. Затем формализуются ключи, зависимости, формы нормализации и физическая реализация. Ошибки на этом этапе приводят к дублям, неверным JOIN и несопоставимости показателей.</p>
<h2 id="overview-1">Банковский пример</h2>
<p>Определите grain: одна строка source_payment — событие, одна строка daily_balance — договор на отчётную дату. Это разные сущности и разные ограничения уникальности.</p>
<h3 id="t001">1. Conceptual Data Model</h3>
<p><strong>Определение и принцип.</strong> Концептуальная модель описывает бизнес-сущности и связи без колонок, типов данных и конкретной СУБД. Это язык обсуждения с владельцами процессов.</p>
<p><strong>Практическая интерпретация.</strong> Клиент заключает договор; договор обслуживается платежами.</p>
<p><strong>Ограничения и проверки.</strong> Не включайте технические ключи и загрузочные поля раньше обсуждения бизнес-смысла.</p>
<h3 id="t002">2. Logical Data Model</h3>
<p><strong>Определение и принцип.</strong> Логическая модель уточняет сущности, атрибуты, идентификаторы, связи, обязательность и ограничения без привязки к конкретным физическим механизмам хранения.</p>
<p><strong>Практическая интерпретация.</strong> Клиент идентифицируется customer_id; договор имеет contract_id и связывается с клиентом.</p>
<p><strong>Ограничения и проверки.</strong> Следует отделять идентичность объекта от меняющегося описания объекта.</p>
<h3 id="t003">3. Physical Data Model</h3>
<p><strong>Определение и принцип.</strong> Физическая модель определяет таблицы, колонки, типы, индексы, секционирование, распределение и другие особенности платформы.</p>
<p><strong>Практическая интерпретация.</strong> Для sat_customer задаётся timestamp с временной зоной, стратегия распределения и уникальность ключа с временем загрузки.</p>
<p><strong>Ограничения и проверки.</strong> Физическую оптимизацию проверяют планами запросов и объёмами, а не только формальными правилами моделирования.</p>
<h3 id="t004">4. Entity и Attribute</h3>
<p><strong>Определение и принцип.</strong> <strong>Entity и Attribute</strong> — самостоятельное понятие в реляционной модели. При проектировании необходимо сформулировать его назначение, входные и выходные данные, правила применимости и зависимость от соседних компонентов. Для корректной реализации следует явно зафиксировать grain, ключей, обязательности атрибутов и ограничений. Термин рассматривается в контексте всей архитектуры, а не как изолированная настройка.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере модели клиентов, договоров и платежей: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте grain, ключей, обязательности атрибутов и ограничений. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>
<h3 id="t005">5. Primary Key, Foreign Key</h3>
<p><strong>Определение и принцип.</strong> Первичный ключ обеспечивает уникальную идентификацию строки; внешний ключ ограничивает допустимые ссылки на другую таблицу. В физической базе внешний ключ может быть не объявлен, но логическая целостность всё равно должна контролироваться.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере модели клиентов, договоров и платежей: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте grain, ключей, обязательности атрибутов и ограничений. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>
<h3 id="t006">6. Natural Key, Business Key, Surrogate Key</h3>
<p><strong>Определение и принцип.</strong> Natural key возникает в данных предметной области; business key выбирается как устойчивый идентификатор бизнес-сущности; surrogate key — искусственный ключ модели. Эти понятия часто перекрываются, но не равнозначны.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере модели клиентов, договоров и платежей: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте grain, ключей, обязательности атрибутов и ограничений. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>
<h3 id="t007">7. Candidate Key и Composite Key</h3>
<p><strong>Определение и принцип.</strong> Candidate key — минимальный набор атрибутов, который однозначно идентифицирует строку. Composite key использует несколько колонок; не каждый составной набор является минимальным кандидатным ключом.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере модели клиентов, договоров и платежей: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте grain, ключей, обязательности атрибутов и ограничений. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>
<h3 id="t008">8. Relationships: 1:1, 1:N, M:N</h3>
<p><strong>Определение и принцип.</strong> Связь 1:1 задаёт одно соответствие, 1:N — множество дочерних строк, M:N требует промежуточной сущности в реляционной реализации. Кардинальность определяют на уровне бизнес-правил, а не только по текущим данным.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере модели клиентов, договоров и платежей: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте grain, ключей, обязательности атрибутов и ограничений. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>
<h3 id="t009">9. Cardinality и Optionality</h3>
<p><strong>Определение и принцип.</strong> Кардинальность задаёт верхнюю/нижнюю границу числа связанных объектов. Optionality указывает, обязателен ли участник: например договор обязан иметь продукт, но клиент может не иметь активного договора.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере модели клиентов, договоров и платежей: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте grain, ключей, обязательности атрибутов и ограничений. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>
<h3 id="t010">10. Grain — уровень детализации записи</h3>
<p><strong>Определение и принцип.</strong> Grain — точное утверждение о том, чему соответствует одна строка. Он определяет допустимые ключи, меры и способы соединения.</p>
<p><strong>Практическая интерпретация.</strong> Одна строка fact_payment = одно событие платежа; одна строка fact_portfolio_daily = один договор за одну отчётную дату.</p>
<p><strong>Ограничения и проверки.</strong> Соединение фактов разных уровней детализации без агрегации часто умножает суммы.</p>
<h3 id="t011">11. Normalization: 1NF, 2NF, 3NF, BCNF</h3>
<p><strong>Определение и принцип.</strong> Нормализация уменьшает структурные зависимости и аномалии обновления. 1NF требует атомарности значений в рамках реляционной модели; 2NF устраняет частичную зависимость неключевых атрибутов от составного кандидатного ключа; 3NF ограничивает транзитивные зависимости; BCNF требует, чтобы всякий нетривиальный детерминант был суперключом.</p>
<p><strong>Практическая интерпретация.</strong> Если имя филиала повторяется в каждой строке договора, отдельная сущность филиала позволяет обновлять его название однократно.</p>
<p><strong>Ограничения и проверки.</strong> Нормализация не равна Data Vault: это правила реляционного проектирования, а Vault — специализированный паттерн исторической интеграции.</p>
<h3 id="t012">12. Denormalization</h3>
<p><strong>Определение и принцип.</strong> Денормализация преднамеренно объединяет данные или повторяет атрибуты ради производительности и удобства чтения. Цена — дополнительный контроль согласованности и риск ошибок обновления.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере модели клиентов, договоров и платежей: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте grain, ключей, обязательности атрибутов и ограничений. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>
<h3 id="t013">13. Entity Relationship Diagrams (ERD)</h3>
<p><strong>Определение и принцип.</strong> ERD визуализирует сущности, атрибуты, ключи и отношения. Нотации отличаются символами и уровнем детализации; диаграмма должна сопровождаться определениями grain и ключей.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере модели клиентов, договоров и платежей: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте grain, ключей, обязательности атрибутов и ограничений. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>
<h3 id="t014">14. Star Schema и Snowflake Schema</h3>
<p><strong>Определение и принцип.</strong> Star хранит измерения обычно в денормализованном виде, Snowflake нормализует отдельные иерархии измерений. Выбор зависит от размеров, повторного использования и профиля BI-запросов.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере модели клиентов, договоров и платежей: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте grain, ключей, обязательности атрибутов и ограничений. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>
<h3 id="t015">15. Slowly Changing Dimensions (SCD Type 0, 1, 2, 3)</h3>
<p><strong>Определение и принцип.</strong> SCD определяет поведение аналитического измерения при изменении атрибутов. Type 0 сохраняет исходное значение; Type 1 перезаписывает; Type 2 создаёт новую историческую строку; Type 3 хранит ограниченную предыдущую версию в дополнительных колонках.</p>
<p><strong>Практическая интерпретация.</strong> Изменение сегмента клиента может требовать Type 2, чтобы отчёт за прошлый месяц воспроизводил старый сегмент.</p>
<p><strong>Ограничения и проверки.</strong> SCD — стратегия измерений, не универсальный синоним любой исторической таблицы.</p>
<h3 id="t016">16. Fact Tables и Dimension Tables</h3>
<p><strong>Определение и принцип.</strong> Fact хранит измеряемые события или состояния на заданном grain, dimension — описательные контексты. Не каждое число является фактом, а не каждое измерение требует SCD Type 2.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере модели клиентов, договоров и платежей: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте grain, ключей, обязательности атрибутов и ограничений. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>
<h3 id="t017">17. Transaction, Periodic Snapshot, Accumulating Snapshot Facts</h3>
<p><strong>Определение и принцип.</strong> Transaction fact представляет событие; periodic snapshot — состояние за период; accumulating snapshot — прохождение процесса по этапам с обновляемыми датами. Grain у них разный.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере модели клиентов, договоров и платежей: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте grain, ключей, обязательности атрибутов и ограничений. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>
