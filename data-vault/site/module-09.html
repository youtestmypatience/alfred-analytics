<h2 id="overview-0">Назначение модуля</h2>
<p>Business Vault предоставляет бизнес-интерпретации поверх Raw Vault. PIT и Bridge сокращают сложность повторяемых аналитических запросов, но требуют строгой временной семантики и механизма пересчёта.</p>
<h2 id="overview-1">Банковский пример</h2>
<p>PIT на конец месяца выбирает версии сателлитов для расчёта статуса договора. Business Vault применяет правила дефолта и формирует итог для витрины.</p>
<h2 id="overview-2">Схема потока данных</h2>
<pre><code class="language-mermaid">flowchart LR
    S[Source Systems] --&gt; ST[Landing / Staging]
    ST --&gt; H[Raw Vault: Hubs / Links / Satellites]
    H --&gt; B[Business Vault: PIT / Bridge]
    B --&gt; M[Dimensional Marts]
    M --&gt; BI[BI / Analytics]
</code></pre>

<p><strong>Определение и принцип.</strong> <strong>Raw Vault vs Business Vault</strong> — самостоятельное понятие в Business Vault. При проектировании необходимо сформулировать его назначение, входные и выходные данные, правила применимости и зависимость от соседних компонентов. Для корректной реализации следует явно зафиксировать бизнес-логики, дат снимка, происхождения результата и обновления. Термин рассматривается в контексте всей архитектуры, а не как изолированная настройка.</p>
<p><strong>Практическая интерпретация.</strong> <strong>Применение.</strong> Рассмотрите этот механизм на примере срезов договоров на отчётную дату: определите уникальность записи, источник значений, момент изменения, способ повторной обработки и ожидаемый результат при расхождениях между источниками. Для данного понятия соответствующие решения должны быть описаны в контракте данных.</p>
<p><strong>Ограничения и проверки.</strong> <strong>Контроль и ограничения.</strong> Проверяйте бизнес-логики, дат снимка, происхождения результата и обновления. Для production необходимо предусмотреть тест корректности, диагностируемую ошибку и сохранение происхождения. Название компонента само по себе не гарантирует нужного поведения: правила зависят от реализации и платформы.</p>

<h3 id="t007">7. Business Key Harmonization</h3>
<p><strong>Определение и принцип.</strong> Гармонизация связывает различающиеся бизнес-ключи источников с общей идентичностью без потери исходных соответствий. Это отдельная, аудируемая задача, особенно при смене идентификаторов.</p>
<p><strong>Практическая интерпретация.</strong> Один клиент может иметь внутренние ID в CRM и АБС; таблица соответствий с периодами действия помогает связать источники.</p>
<p><strong>Ограничения и проверки.</strong> Совпадение ФИО или телефона само по себе не доказывает тождественность клиентов.</p>

<p><strong>Практическая интерпретация.</strong> PIT_CUSTOMER на каждый конец месяца хранит LOAD_DTS выбранных Satellite-версий.</p>
<p><strong>Ограничения и проверки.</strong> PIT — ускоряющая структура: исправление истории требует её согласованного пересчёта.</p>

<p><strong>Практическая интерпретация.</strong> Клиент → договор → залог может быть заранее разрешён в одну структуру с определённой исторической семантикой.</p>
